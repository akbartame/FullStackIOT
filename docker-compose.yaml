services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: fsiot-backend:latest
    container_name: fsiot-backend
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      # Persist SQLite database on the host
      - ./backend/data:/app/backend/data

    env_file:
      - ./backend/.env

    environment:
      - NODE_ENV=production

    # Resource limits — sensible floor for a lightweight IoT backend
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Ensure container restarts are not too aggressive
    stop_grace_period: 10s