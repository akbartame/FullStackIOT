version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: fsiot-backend:latest
    container_name: fsiot-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./backend/data:/app/backend/data
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
